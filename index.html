<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六角形グリッド波動パルス伝播シミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center py-6">
<h1 class="text-2xl font-bold mb-4 text-teal-400">六角形グリッド波動パルス伝播シミュレーター</h1>
<canvas id="canvas" width="600" height="480" class="border border-gray-600 rounded cursor-crosshair" aria-label="六角形グリッド波動シミュレーション"></canvas>
<div class="mt-4 grid grid-cols-2 gap-4 w-full max-w-xl px-4">
  <div>
    <label class="block text-sm text-gray-400 mb-1">波速: <span id="wvVal">0.4</span></label>
    <input type="range" id="wv" min="0.05" max="0.9" step="0.05" value="0.4" class="w-full accent-teal-400">
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">減衰係数: <span id="dampVal">0.995</span></label>
    <input type="range" id="damp" min="0.95" max="0.9999" step="0.0001" value="0.995" class="w-full accent-teal-400">
  </div>
  <div class="flex gap-2 items-end col-span-2">
    <button id="clearBtn" class="px-4 py-2 bg-teal-700 hover:bg-teal-600 rounded text-sm">クリア</button>
    <button id="obstacleBtn" class="px-4 py-2 bg-orange-700 hover:bg-orange-600 rounded text-sm">障害物モード切替</button>
    <span id="modeLabel" class="text-xs text-gray-400 self-center">現在: パルス発生モード</span>
  </div>
</div>
<p class="mt-2 text-xs text-gray-500">クリックでパルス発生 / 障害物モードでクリックすると障害物配置</p>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 600, H = 480;
const HEX_R = 14;
const HW = HEX_R * Math.sqrt(3);
const HH = HEX_R * 1.5;
const COLS = Math.floor(W / HW) + 1;
const ROWS = Math.floor(H / HH) + 1;

let waveSpeed = 0.4, dampCoeff = 0.995;
let obstacleMode = false;

const cur = new Float32Array(COLS * ROWS);
const prev = new Float32Array(COLS * ROWS);
const obstacles = new Uint8Array(COLS * ROWS);

function idx(c, r) { return r * COLS + c; }

function hexCenter(col, row) {
  const offset = (row % 2) * HW / 2;
  return { x: col * HW + offset + HW / 2, y: row * HH + HEX_R };
}

function hexPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function step() {
  const c2 = waveSpeed * waveSpeed;
  for (let row = 1; row < ROWS - 1; row++) {
    for (let col = 1; col < COLS - 1; col++) {
      if (obstacles[idx(col, row)]) continue;
      const neighbors = getNeighbors(col, row);
      let sum = 0;
      for (const [nc, nr] of neighbors) {
        if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) sum += cur[idx(nc, nr)];
      }
      const n = neighbors.length;
      const next = (2 * cur[idx(col, row)] - prev[idx(col, row)] + c2 * (sum - n * cur[idx(col, row)])) * dampCoeff;
      prev[idx(col, row)] = cur[idx(col, row)];
      cur[idx(col, row)] = Math.max(-1, Math.min(1, next));
    }
  }
}

function getNeighbors(col, row) {
  if (row % 2 === 0) {
    return [[col-1,row],[col+1,row],[col-1,row-1],[col,row-1],[col-1,row+1],[col,row+1]];
  } else {
    return [[col-1,row],[col+1,row],[col,row-1],[col+1,row-1],[col,row+1],[col+1,row+1]];
  }
}

function draw() {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, W, H);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const { x, y } = hexCenter(col, row);
      if (x < -HW || x > W + HW || y < -HH || y > H + HH) continue;
      const i = idx(col, row);
      hexPath(x, y, HEX_R - 1);
      if (obstacles[i]) {
        ctx.fillStyle = '#6b7280';
      } else {
        const v = cur[i];
        const r = v > 0 ? Math.floor(v * 100) : 0;
        const b = v < 0 ? Math.floor(-v * 150) : 0;
        const g = Math.floor(Math.abs(v) * 50);
        ctx.fillStyle = `rgb(${r},${120+g},${200+b})`;
      }
      ctx.fill();
    }
  }
}

function animate() {
  step();
  draw();
  requestAnimationFrame(animate);
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = null, bestD = Infinity;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const { x, y } = hexCenter(col, row);
      const d = (mx-x)**2 + (my-y)**2;
      if (d < bestD) { bestD = d; best = [col, row]; }
    }
  }
  if (best) {
    const [c, r] = best;
    if (obstacleMode) {
      obstacles[idx(c, r)] ^= 1;
    } else {
      cur[idx(c, r)] = 1.0;
    }
  }
});

document.getElementById('wv').addEventListener('input', e => {
  waveSpeed = parseFloat(e.target.value);
  document.getElementById('wvVal').textContent = waveSpeed.toFixed(2);
});
document.getElementById('damp').addEventListener('input', e => {
  dampCoeff = parseFloat(e.target.value);
  document.getElementById('dampVal').textContent = dampCoeff.toFixed(4);
});
document.getElementById('clearBtn').addEventListener('click', () => {
  cur.fill(0); prev.fill(0); obstacles.fill(0);
});
document.getElementById('obstacleBtn').addEventListener('click', () => {
  obstacleMode = !obstacleMode;
  document.getElementById('modeLabel').textContent = `現在: ${obstacleMode ? '障害物配置モード' : 'パルス発生モード'}`;
});

animate();
</script>
</body>
</html>
